#cloud-config
package_update: true
package_upgrade: true

packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg
  - lsb-release
  - git
  - iptables-persistent
  - netfilter-persistent

runcmd:
  # ---------------------------------------------------------------------------
  # 1. Configurar Firewall del Sistema Operativo (Ubuntu en OCI)
  # OCI por defecto bloquea puertos en iptables a nivel de SO. Abrimos 80, 443 y 8080.
  # ---------------------------------------------------------------------------
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 80 -j ACCEPT
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 443 -j ACCEPT
  - iptables -I INPUT 6 -m state --state NEW -p tcp --dport 8080 -j ACCEPT
  - netfilter-persistent save

  # ---------------------------------------------------------------------------
  # 2. Instalar Docker CE y Docker Compose Plugin (oficial)
  # ---------------------------------------------------------------------------
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  - apt-get update -y
  - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

  # ---------------------------------------------------------------------------
  # 3. Habilitar servicio de Docker y permisos al usuario ubuntu
  # ---------------------------------------------------------------------------
  - systemctl enable docker
  - systemctl start docker
  - usermod -aG docker ubuntu

  # ---------------------------------------------------------------------------
  # 4. Preparar directorio de trabajo para la aplicación
  # ---------------------------------------------------------------------------
  - mkdir -p /opt/meddibuddy
  - chown -R ubuntu:ubuntu /opt/meddibuddy

final_message: "Instancia MeddiBudy configurada con Docker y puertos abiertos. Lista para despliegue."
