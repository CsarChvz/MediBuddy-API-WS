spring.application.name=meddibuddy-sockets
server.port=8080

# Base de Datos H2 (rápida, embebida y sin dependencias externas)
spring.datasource.url=jdbc:h2:mem:meddibuddy_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (accesible en http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Seguridad / Claves Maestras para Dispositivos
meddibuddy.security.default-api-key=meddibuddy-secret-esp32-key-2026
meddibuddy.security.default-jwt-secret=meddibuddy-jwt-secret-android-token-2026

# Logging
logging.level.com.meddibuddy.meddibuddy_sockets=DEBUG
logging.level.org.springframework.web.socket=INFO
