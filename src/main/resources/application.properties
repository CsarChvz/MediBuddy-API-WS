spring.application.name=meddibuddy-sockets
server.port=${PORT:8080}

# Base de Datos configurable por variables de entorno (H2 por defecto en dev, PostgreSQL en prod)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:meddibuddy_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 Console (accesible en /h2-console solo si está habilitado)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Seguridad / Claves Maestras para Dispositivos y JWT
meddibuddy.security.default-api-key=${MEDDIBUDDY_API_KEY:meddibuddy-secret-esp32-key-2026}
meddibuddy.security.default-jwt-secret=${MEDDIBUDDY_JWT_SECRET:meddibuddy-jwt-secret-android-token-2026}

# Logging
logging.level.com.meddibuddy.meddibuddy_sockets=${LOG_LEVEL_MEDIBUDDY:DEBUG}
logging.level.org.springframework.web.socket=INFO
